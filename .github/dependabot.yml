version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Resolves against pyproject.toml and keeps uv.lock in step, which the
  # `uv sync --frozen` steps in CI require.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
