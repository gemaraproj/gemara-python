version: 2

updates:
  # Actions are pinned to commit SHAs so that a compromised tag cannot silently
  # change what runs in CI; dependabot is what keeps those pins from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait out the window in which a freshly published malicious release is
    # most likely to be caught and yanked before we open a PR for it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Resolves against pyproject.toml and keeps uv.lock in step, which the
  # `uv sync --frozen` steps in CI require.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait out the window in which a freshly published malicious release is
    # most likely to be caught and yanked before we open a PR for it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
