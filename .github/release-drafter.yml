---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
include-pre-releases: true
template: |
  # Changelog
  $CHANGES

  See details of [all code changes](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION) since previous release

exclude-labels:
  - "skip-changelog"

categories:
  - title: "💥 Breaking Changes"
    labels:
      - "breaking"
      - "major"
      - "release:major"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
      - "minor"
      - "release:minor"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
      - "patch"
      - "release:patch"
  - title: "🧰 Maintenance"
    labels:
      - "infrastructure"
      - "automation"
      - "documentation"
      - "dependencies"
      - "maintenance"
      - "revert"
  - title: "🏎 Performance"
    labels:
      - "performance"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

version-resolver:
  major:
    labels:
      - "breaking"
      - "major"
      - "release:major"
  minor:
    labels:
      - "feature"
      - "enhancement"
      - "minor"
      - "release:minor"
  patch:
    labels:
      - "fix"
      - "documentation"
      - "maintenance"
      - "patch"
      - "release:patch"
  default: patch

autolabeler:
  - label: "automation"
    title:
      - "/^(build|ci|perf|refactor|test).*/i"
  - label: "enhancement"
    title:
      - "/^(style).*/i"
  - label: "documentation"
    title:
      - "/^(docs).*/i"
  - label: "feature"
    title:
      - "/^(feat).*/i"
  - label: "fix"
    title:
      - "/^(fix).*/i"
  - label: "infrastructure"
    title:
      - "/^(infrastructure).*/i"
  - label: "maintenance"
    title:
      - "/^(chore|maintenance).*/i"
  - label: "revert"
    title:
      - "/^(revert).*/i"
