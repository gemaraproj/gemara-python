name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref: a push that lands while CI is still
# working makes the older run's result irrelevant. `main` is excluded so pushes
# there always produce a complete record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; no job here needs to write back to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group test --python ${{ matrix.python-version }}
      - name: Run tests, failing if any is skipped
        run: |
          # Defect 1 was a suite that skipped 39 of 40 tests and stayed green.
          set -o pipefail
          uv run pytest -q | tee summary.txt
          if grep -qE '[0-9]+ skipped' summary.txt; then
            echo "::error::tests were skipped; the fixture corpus must always run"
            exit 1
          fi

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run poe lint
      - run: uv run ruff format --check .
      - run: uv run poe typecheck

  workflows:
    name: Workflow security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Audit workflows and dependabot config with zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Emit inline annotations rather than SARIF: results land on the PR
          # without depending on code scanning being enabled for the repo.
          # The two options are mutually exclusive.
          advanced-security: false
          annotations: true

  drift:
    name: Generated-model drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group codegen --group lint
      - name: Regenerate models from the vendored schema
        # Called directly rather than through poe, which lives in the dev group.
        run: uv run python tools/generate.py
      - name: Fail if the committed output drifted
        run: |
          git diff --exit-code src/gemara/v1/_models.py src/gemara/v1/_registry.py \
            || { echo "::error::generated files are stale; run 'uv run poe generate'"; exit 1; }

  lower-bounds:
    name: Lowest direct dependencies
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Resolve and install the lowest declared direct dependencies
        run: uv sync
      - name: Show what actually got installed
        run: uv run python -c "import pydantic, pytest; print('pydantic', pydantic.VERSION, '| pytest', pytest.__version__)"
      - run: uv run pytest -q
