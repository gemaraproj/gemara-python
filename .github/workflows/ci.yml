name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run tests, failing if any is skipped
        run: |
          # Defect 1 was a suite that skipped 39 of 40 tests and stayed green.
          set -o pipefail
          uv run pytest -q | tee summary.txt
          if grep -qE '[0-9]+ skipped' summary.txt; then
            echo "::error::tests were skipped; the fixture corpus must always run"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run poe lint
      - run: uv run ruff format --check .
      - run: uv run poe typecheck

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Regenerate models from the vendored schema
        run: uv run poe generate
      - name: Fail if the committed output drifted
        run: |
          git diff --exit-code src/gemara/v1/_models.py src/gemara/v1/_registry.py \
            || { echo "::error::generated files are stale; run 'uv run poe generate'"; exit 1; }

  lower-bounds:
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Resolve and install the lowest declared direct dependencies
        run: uv sync
      - name: Show what actually got installed
        run: uv run python -c "import pydantic, pytest; print('pydantic', pydantic.VERSION, '| pytest', pytest.__version__)"
      - run: uv run pytest -q
