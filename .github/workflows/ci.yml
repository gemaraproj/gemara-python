name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # `main` is excluded so pushes there always produce a complete record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group test --python ${{ matrix.python-version }}
      - name: Run tests, failing if any is skipped
        run: |
          # Defect 1 was a suite that skipped 39 of 40 tests and stayed green.
          set -o pipefail
          uv run pytest -q | tee summary.txt
          if grep -qE '[0-9]+ skipped' summary.txt; then
            echo "::error::tests were skipped; the fixture corpus must always run"
            exit 1
          fi

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run poe lint
      - run: uv run ruff format --check .
      - run: uv run poe typecheck

  drift:
    name: Generated-model drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group codegen --group lint
      - name: Regenerate models from the vendored schema
        run: uv run poe generate
      - name: Fail if the committed output drifted
        run: |
          git diff --exit-code src/gemara/v1/_models.py src/gemara/v1/_registry.py \
            || { echo "::error::generated files are stale; run 'uv run poe generate'"; exit 1; }
