name: Publish to TestPyPI

on:
  workflow_dispatch:
  push:
    tags: [ "test-v*" ]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # For trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Rehearsals get re-run against an unchanged version; that should be a
          # no-op rather than a failure.
          skip-existing: true

  verify-published:
    name: Test the TestPyPI package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: $/.github/actions/verify-published-package
        with:
          index-url: https://test.pypi.org/simple
          extra-index-url: https://pypi.org/simple
