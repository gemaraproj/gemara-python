name: Publish to TestPyPI

# Manual only. TestPyPI is a rehearsal space, so it is deliberately not chained
# to the tag-driven release: coupling them means you cannot rehearse without
# burning a real version, and a TestPyPI hiccup (most often "version already
# exists") would block a PyPI release that was otherwise fine.
#
# Pick the ref to publish in the Actions UI when dispatching.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # Trusted publishing: mint a short-lived OIDC token instead of holding a
      # long-lived PyPI API token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Publishes real artifacts, so it must not restore a cache that a pull
          # request workflow could have poisoned.
          enable-cache: false
      - run: uv sync --frozen
      - name: Run tests, failing if any is skipped
        run: |
          set -o pipefail
          uv run pytest -q | tee summary.txt
          if grep -qE '[0-9]+ skipped' summary.txt; then
            echo "::error::tests were skipped; the fixture corpus must always run"
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Rehearsals get re-run against an unchanged version; that should be a
          # no-op rather than a failure.
          skip-existing: true
